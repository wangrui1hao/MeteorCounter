name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check release version
        run: python scripts/check_release_version.py "$env:GITHUB_REF"
      - name: Prepare environment
        run: ./scripts/setup.ps1 -PythonExecutable (Get-Command python).Source
      - name: Build standalone EXE
        run: ./scripts/build.ps1
      - name: Show failure diagnostics
        if: failure()
        run: |
          Get-ChildItem build -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "--- $($_.FullName)"
            Get-Content -LiteralPath $_.FullName -Tail 100
          }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # GitHub sanitizes non-ASCII asset names; keep a stable download filename.
          $asset = Join-Path $env:RUNNER_TEMP 'MeteorCounter.exe'
          Copy-Item -LiteralPath 'publish/陨星计数器.exe' -Destination $asset
          gh release create "$env:RELEASE_TAG" "$asset#陨星计数器" --verify-tag --title "$env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten.' }
